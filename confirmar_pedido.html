<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdmFood - Confirmar pedido</title>
  <link rel="icon" type="image/x-icon" href="imgs/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="imgs/favicon-32.png">
  <link rel="apple-touch-icon" href="imgs/apple-touch-icon.png">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="preencher_contagem.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@1.48.0/dist/umd/lucide.min.js" integrity="sha384-Hh7C333mXel+qppGoFs4qAOXp7h67eur4XsQVF2bvHAM3MQ4DX4cQI7oRCzb98J4" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="script.js" defer></script>
</head>
<body>

  <div class="contagem-publica-wrap">
    <div class="contagem-publica-header">
      <div class="logo-icon">
        <i data-lucide="utensils-crossed"></i>
      </div>
      <span class="brand-name">
        <span class="brand-dark">Adm.</span><span class="brand-red">Food</span>
      </span>
    </div>

    <div id="pedido-publico-carregando" class="contagem-publica-card">
      <p class="panel-subtitle">Carregando...</p>
    </div>

    <div id="pedido-publico-erro" class="contagem-publica-card" style="display:none;">
      <p id="pedido-publico-erro-texto" class="form-erro">—</p>
    </div>

    <div id="pedido-publico-confirmado" class="contagem-publica-card" style="display:none;">
      <i data-lucide="check-circle-2" class="contagem-publica-icone-ok"></i>
      <!-- "Recebimento", no sistema, é o que a LOJA faz quando a mercadoria
           chega. Aqui o fornecedor está dizendo que recebeu o PEDIDO e vai
           entregar — as duas pontas liam a mesma palavra de jeito diferente
           (QA 22/09). -->
      <h2>Pedido aceito!</h2>
      <p class="panel-subtitle" id="pedido-publico-confirmado-texto">A compradora já está vendo que você recebeu o pedido e vai entregar.</p>
    </div>

    <div id="pedido-publico-conteudo" class="contagem-publica-card" style="display:none;">
      <h2>Pedido de compra — <span id="pedido-publico-fornecedor">—</span></h2>
      <p class="panel-subtitle">Confira os itens de cada loja abaixo e avise se você consegue entregar.</p>

      <!-- Prazo de pagamento e dia de entrega existiam só no texto do
           WhatsApp: quem abria o link direto não via nada (QA 22/09). -->
      <p class="pedido-publico-condicoes" id="pedido-publico-condicoes" hidden></p>

      <div id="pedido-publico-lojas"><!-- Renderizado dinamicamente via JS --></div>

      <p class="contagem-publica-prazo">Valor total: <strong id="pedido-publico-valor-total">—</strong></p>

      <!-- Era tudo ou nada: não dava pra dizer "esse item eu não tenho",
           "mando metade" ou "entrego quinta" (QA 22/09). -->
      <div class="form-group pedido-publico-ressalva">
        <label for="pedido-publico-observacao">Tem alguma ressalva? (opcional)</label>
        <textarea id="pedido-publico-observacao" rows="3" maxlength="500"
          placeholder="Ex: o bacon está em falta, mando o resto quinta · consigo metade da batata · entrego só na sexta"></textarea>
        <p class="panel-subtitle">O que você escrever aqui aparece pra compradora junto com o pedido.</p>
      </div>

      <button type="button" class="btn-primary" id="btn-pedido-publico-confirmar">Aceitar e entregar</button>
    </div>
  </div>

</body>
</html>
