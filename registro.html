<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesse o Painel</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="registro.css">
</head>
<body>
  <div class="registro-container">
    <!-- Header / Logo -->
    <div class="brand">
      <img src="imgs/Adm Food Logo.jpg" alt="Logo Adm.Food" class="brand-logo-icon">
      <span class="brand-name">
        <span class="brand-dark">Adm.</span><span class="brand-red">Food</span>
      </span>
    </div>

    <!-- Card de Login -->
    <div class="registro-card">
      <h1 class="card-title">Crie sua conta</h1>
      <p class="card-subtitle">Crie sua conta com nome, e-mail e senha ou use sua conta Google.</p>

      <form class="registro-form" action="#" method="POST">
        <div class="form-group">
          <label for="nome" class="form-label">Nome</label>
          <input 
            type="nome" 
            id="nome" 
            name="nome" 
            class="form-input" 
            placeholder="Nome Completo" 
            required
          >
        </div>
        
        <div class="form-group">
          <label for="email" class="form-label">E-mail</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-input" 
            placeholder="voce@cardapioweb.com" 
            required
          >
        </div>

        <div class="form-group">
          <label for="senha" class="form-label">Senha</label>
          <input 
            type="password" 
            id="senha" 
            name="senha" 
            class="form-input" 
            placeholder="••••••" 
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmesenha" class="form-label">Confirme Senha</label>
          <input 
            type="password" 
            id="confirmesenha" 
            name="confirmesenha" 
            class="form-input" 
            placeholder="••••••" 
            required
          >
        </div>

        <button type="submit" class="btn-primary">Cadastrar</button>

        <!-- Divisor 'ou' -->
        <div class="divider">
          <span>ou</span>
        </div>

        <!-- Botão Google -->
        <button type="button" onclick="loginGoogle()" class="btn-google">
          <svg class="google-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Entrar com Google
        </button>

        <!-- Links de Rodapé do Formulário -->
        <div class="form-footer-links">
          <p>Já possui conta? <a href="login.html" class="link-red">Realizar login</a></p>
          <p><a href="landing.html" class="link-red">Voltar para o início</a></p>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
