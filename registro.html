<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio Web - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Logo Superior -->
  <div class="flex items-center gap-3 mb-8">
    <div class="bg-[#D34537] text-white p-2.5 rounded-xl flex items-center justify-center shadow-sm">
      <i class="fa-solid fa-utensils text-lg"></i>
    </div>
    <span class="font-extrabold text-xl tracking-tight uppercase">LOGO</span>
  </div>

  <!-- Card do Formulário de Login -->
  <div class="w-full max-w-md bg-white border border-gray-200/80 rounded-2xl p-8 shadow-sm text-center">
    
    <!-- Título do Card -->
    <h1 class="text-2xl font-bold text-gray-900 mb-1">Acessar o painel</h1>
    <p class="text-xs md:text-sm text-gray-500 mb-6">
      Entre com e-mail e senha ou use sua conta Google.
    </p>

    <!-- Formulário -->
    <form id="formLogin" onsubmit="realizarLogin(event)" class="text-left space-y-4">
      <!-- Campo Nome -->
       <div>
        <label for="email" class="block text-xs font-semibold text-gray-800 mb-1">Nome Completo</label>
        <input type="nome" id="nome" required
        placeholder="Nome e Sobrenome"
               class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-[#D34537] focus:ring-1 focus:ring-[#D34537] text-sm transition">
      </div>

      <!-- Campo Email -->
      <div>
        <label for="email" class="block text-xs font-semibold text-gray-800 mb-1">E-mail</label>
        <input type="email" id="email" required
               placeholder="voce@cardapioweb.com" 
               class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-[#D34537] focus:ring-1 focus:ring-[#D34537] text-sm transition">
      </div>

      <!-- Campo Senha -->
      <div>
        <label for="password" class="block text-xs font-semibold text-gray-800 mb-1">Senha</label>
        <input type="password" id="password" required
               placeholder="••••••" 
               class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-[#D34537] focus:ring-1 focus:ring-[#D34537] text-sm transition">
      </div>

      <!-- Campo Confirmação de Senha -->
      <div>
        <label for="password" class="block text-xs font-semibold text-gray-800 mb-1">Confirme sua senha</label>
        <input type="password" id="password" required
               placeholder="••••••" 
               class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-[#D34537] focus:ring-1 focus:ring-[#D34537] text-sm transition">
      </div>

      <!-- Botão Entrar -->
      <button type="submit" 
              class="w-full bg-[#D34537] hover:bg-[#b8382b] text-white font-semibold py-2.5 rounded-xl transition duration-200 shadow-sm text-sm active:scale-95">
        Entrar
      </button>
    </form>

    <!-- Divisor 'ou' -->
    <div class="relative flex py-5 items-center">
      <div class="flex-grow border-t border-gray-200"></div>
      <span class="flex-shrink mx-3 text-xs text-gray-400">ou</span>
      <div class="flex-grow border-t border-gray-200"></div>
    </div>

    <!-- Botão Google -->
    <button type="button" onclick="loginGoogle()"
            class="w-full bg-gray-50 hover:bg-gray-100 border border-gray-200 text-gray-700 font-medium py-2.5 rounded-xl flex items-center justify-center gap-2 transition duration-200 text-sm">
      <!-- Ícone Google (SVG para máxima precisão visual) -->
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Entrar com Google
    </button>

    <!-- Links de Rodapé do Card -->
    <div class="mt-6 text-xs text-gray-500 space-y-2">
      <p>Ainda não tem conta? <a href="#" class="text-[#D34537] font-semibold hover:underline">Cadastre-se</a></p>
      <p><a href="landing.html" class="text-[#D34537] font-semibold hover:underline">Voltar para o início</a></p>
    </div>

  </div>

  <script>
    function realizarLogin(event) {
      event.preventDefault(); // Evita recarregar a página
      
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      // Exemplo de direcionamento para o painel de redes após login
      console.log("Tentando logar com:", email);
      
      // Aqui você altera para a URL do seu painel principal (ex: dashboard.html ou /dashboard)
      window.location.href = "dashboard.html"; 
    }

    function loginGoogle() {
      alert("Redirecionando para autenticação do Google...");
    }
  </script>
</body>
</html>
