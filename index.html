<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fechamento Diário de Vendas</title>
    <link rel="stylesheet" href ="style.css">
</head>
<body>
    <div class="main-card">
        <!-- HERO SECTION -->
        <main class="hero-section">
            
            <!-- ESQUERDA: TEXTO E CHAMADA -->
            <section class="hero-left">
                <h1 class="hero-title">Relatório de Vendas Simplificado</h1>

                <div class="hero-description">
                    <h3 class>Agilize o envio dos relatórios de vendas e garanta a precisão dos dados em tempo real.</h3>
                </div>
            </section>

            <!-- DIREITA: FORMULÁRIO CARD -->
            <section class="hero-right">
                <h2 class="form-title">Selecione a unidade e informe o valor presencial.</h2>

                 <form id="form-fechamento">
            
                 <label for="loja">Selecione a Loja:</label>
                 <select id="loja" name="loja" required>
                    <option value="Artesano's">Artesano's</option>
                    <option value="Tradiça ZN">Tradiça ZN</option>
                    <option value="Tradiça Simus">Tradiça Simus</option>
                    <option value="Açaí na Lata">Açaí na Lata</option>
            </select>

            <label for="data">Data do Fechamento:</label>
            <input type="date" id="data" name="data" required>

            <label for="presencial">Vendas Presencial (R$):</label>
            <input type="number" id="presencial" name="presencial" placeholder="0,00" required autocomplete="off">
                    <button type="submit" id="btn-enviar">PROCESSAR E ENVIAR RELATÓRIO</button>
                    
                </form>
            </section>

        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
