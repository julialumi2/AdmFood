<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fechamento Diário de Vendas</title>
    <link rel="stylesheet" href ="style.css">
</head>
<body>
    <div class="card">
        <h2>Fechamento Diário de Vendas</h2>
        <form id="form-fechamento">
            
            <label for="loja">Selecione a Loja:</label>
            <select id="loja" name="loja" required>
                <option value="Artesano's">Artesano's</option>
                <option value="Tradiça ZN">Tradiça ZN</option>
                <option value="Tradiça Simus">Tradiça Simus</option>
                <option value="Açaí na Lata">Açaí na Lata</option>
            </select>

            <label for="data">Data do Fechamento:</label>
            <input type="date" id="data" name="data" required>

            <label for="presencial">Vendas Presencial (R$):</label>
            <input type="number" id="presencial" name="presencial" step="0.01" placeholder="Ex: 1250.50" required>

            <button type="submit" id="btn-enviar">🚀 Processar e Enviar Relatório</button>
        </form>

        <div id="mensagem" class="status-msg"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
