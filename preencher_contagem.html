<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- A barra do navegador no celular acompanha o fundo do sistema; o
         script troca pro escuro quando o modo noturno está ligado. -->
    <meta name="theme-color" content="#FFFAFA">
  <title>AdmFood - Requisição de estoque</title>
  <link rel="icon" type="image/x-icon" href="imgs/favicon.ico">
  <!-- SVG primeiro: navegador moderno prefere ele e não precisa
       de um PNG por tamanho. Os dois de baixo ficam de reserva. -->
  <link rel="icon" type="image/svg+xml" href="imgs/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="imgs/favicon-32.png">
  <link rel="apple-touch-icon" href="imgs/apple-touch-icon.png">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="preencher_contagem.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Fraunces:opsz,wght,SOFT,WONK@9..144,600..800,0..100,0..1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@1.48.0/dist/umd/lucide.min.js" integrity="sha384-Hh7C333mXel+qppGoFs4qAOXp7h67eur4XsQVF2bvHAM3MQ4DX4cQI7oRCzb98J4" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="script.js" defer></script>
</head>
<body>

  <div class="contagem-publica-wrap">
    <div class="contagem-publica-header">
      <div class="logo-icon">
        <svg viewBox="0 0 48 48" aria-hidden="true"><defs><mask id="marca-sidebar"><rect width="48" height="48" fill="#000"/><path fill="#fff" d="M24 3 L48 44 L0 44 Z"/><path fill="#000" d="M24 17.5 L28.95 26 L19.05 26 Z"/><path fill="#000" d="M16.12 31 L31.88 31 L39.48 44 L8.52 44 Z"/><g fill="#000"><rect x="10.9" y="36.4" width="8.2" height="7.6"/><rect x="18.4" y="31.4" width="8.2" height="12.6"/><rect x="25.9" y="25.4" width="8.2" height="18.6"/></g></mask></defs><rect width="48" height="48" fill="currentColor" mask="url(#marca-sidebar)"/><g fill="currentColor"><rect x="12.5" y="38" width="5" height="6"/><rect x="20" y="33" width="5" height="11"/><rect x="27.5" y="27" width="5" height="17"/></g></svg>
      </div>
      <span class="brand-name">
        <span class="brand-dark">Adm.</span><span class="brand-red">Food</span>
      </span>
    </div>

    <div id="contagem-publica-carregando" class="contagem-publica-card">
      <p class="panel-subtitle">Carregando...</p>
    </div>

    <div id="contagem-publica-erro" class="contagem-publica-card" style="display:none;">
      <p id="contagem-publica-erro-texto" class="form-erro">—</p>
    </div>

    <div id="contagem-publica-obrigado" class="contagem-publica-card" style="display:none;">
      <i data-lucide="check-circle-2" class="contagem-publica-icone-ok"></i>
      <h2>Requisição enviada, obrigado!</h2>
      <p class="panel-subtitle">Já registramos o que você preencheu.</p>
    </div>

    <!-- Um card por item, no formato do link da VMarket (pedido da Julia, 11/09/2026) -->
    <form id="form-contagem-publica" style="display:none;">
      <div class="contagem-publica-card">
        <h2 id="contagem-publica-titulo">Preencher requisição de estoque</h2>
        <p class="contagem-publica-prazo" id="contagem-publica-subtitulo">—</p>
        <p class="panel-subtitle">Preencha a quantidade que tem hoje de cada item (os que estiverem zerados, preencha com 0 mesmo assim).</p>
        <p class="contagem-publica-progresso" id="contagem-publica-progresso">Você preencheu 0 de 0 itens</p>
        <!-- Em lista de 100 itens, achar o que ficou pra trás era rolar tudo
             de novo (QA 22/09). -->
        <button type="button" class="contagem-ir-vazio" id="btn-contagem-ir-vazio" hidden></button>
        <!-- O que já estava digitado neste aparelho volta ao abrir o link (QA 22/09) -->
        <p class="contagem-publica-rascunho" id="contagem-publica-rascunho" hidden></p>
        <div class="contagem-publica-filtros">
          <div class="search-box">
            <i data-lucide="search"></i>
            <input type="text" id="contagem-publica-busca" placeholder="Busque pelo nome do produto...">
          </div>
          <!-- Só no computador; no celular a seção é pelo botão flutuante "Seções" -->
          <select id="contagem-publica-filtro-secao">
            <option value="">Todas as seções</option>
          </select>
        </div>
      </div>

      <div id="contagem-publica-itens">
        <!-- Renderizado dinamicamente via JS, agrupado por seção -->
      </div>

      <button type="submit" class="btn-primary" id="btn-contagem-publica-enviar">Enviar requisição</button>
    </form>
  </div>

  <!-- Botão flutuante de seções: pula direto pra uma seção -->
  <div class="contagem-secoes" id="contagem-secoes" hidden>
    <div class="contagem-secoes-menu" id="contagem-secoes-menu" hidden></div>
    <button type="button" class="contagem-secoes-botao" id="contagem-secoes-botao" aria-expanded="false">
      Seções <i data-lucide="chevron-up"></i>
    </button>
  </div>

</body>
</html>
