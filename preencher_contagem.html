<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdmFood - Requisição de estoque</title>
  <link rel="icon" type="image/x-icon" href="imgs/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="imgs/favicon-32.png">
  <link rel="apple-touch-icon" href="imgs/apple-touch-icon.png">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="preencher_contagem.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="script.js" defer></script>
</head>
<body>

  <div class="contagem-publica-wrap">
    <div class="contagem-publica-header">
      <div class="logo-icon">
        <i data-lucide="utensils-crossed"></i>
      </div>
      <span class="brand-name">
        <span class="brand-dark">Adm.</span><span class="brand-red">Food</span>
      </span>
    </div>

    <div id="contagem-publica-carregando" class="contagem-publica-card">
      <p class="panel-subtitle">Carregando...</p>
    </div>

    <div id="contagem-publica-erro" class="contagem-publica-card" style="display:none;">
      <p id="contagem-publica-erro-texto" class="form-erro">—</p>
    </div>

    <div id="contagem-publica-obrigado" class="contagem-publica-card" style="display:none;">
      <i data-lucide="check-circle-2" class="contagem-publica-icone-ok"></i>
      <h2>Requisição enviada, obrigado!</h2>
      <p class="panel-subtitle">Já registramos o que você preencheu.</p>
    </div>

    <!-- Um card por item, no formato do link da VMarket (pedido da Julia, 11/09/2026) -->
    <form id="form-contagem-publica" style="display:none;">
      <div class="contagem-publica-card">
        <h2 id="contagem-publica-titulo">Preencher requisição de estoque</h2>
        <p class="contagem-publica-prazo" id="contagem-publica-subtitulo">—</p>
        <p class="panel-subtitle">Preencha a quantidade que tem hoje de cada item (os que estiverem zerados, preencha com 0 mesmo assim).</p>
        <p class="contagem-publica-progresso" id="contagem-publica-progresso">Você preencheu 0 de 0 itens</p>
        <div class="contagem-publica-filtros">
          <div class="search-box">
            <i data-lucide="search"></i>
            <input type="text" id="contagem-publica-busca" placeholder="Busque pelo nome do produto...">
          </div>
          <!-- Só no computador; no celular a seção é pelo botão flutuante "Seções" -->
          <select id="contagem-publica-filtro-secao">
            <option value="">Todas as seções</option>
          </select>
        </div>
      </div>

      <div id="contagem-publica-itens">
        <!-- Renderizado dinamicamente via JS, agrupado por seção -->
      </div>

      <button type="submit" class="btn-primary" id="btn-contagem-publica-enviar">Enviar requisição</button>
    </form>
  </div>

  <!-- Botão flutuante de seções: pula direto pra uma seção -->
  <div class="contagem-secoes" id="contagem-secoes" hidden>
    <div class="contagem-secoes-menu" id="contagem-secoes-menu" hidden></div>
    <button type="button" class="contagem-secoes-botao" id="contagem-secoes-botao" aria-expanded="false">
      Seções <i data-lucide="chevron-up"></i>
    </button>
  </div>

</body>
</html>
